<!DOCTYPE html>
<html>
<head>
    <title>Чагин Фёдор, ЛР-4</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
            color: #1a2a3a;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1, h3 { margin-top: 0; color: #1e3a5f; }
        input, button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background: #1e3a5f;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 8px;
        }
        button:hover { background: #0f2b44; }
        button:disabled { background: #9aaebf; cursor: not-allowed; }
        .result {
            background: #e8f0fe;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .thumbnail {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .error { color: #c62828; background: #ffebee; padding: 12px; border-radius: 8px; }
        pre { background: #1e2a36; color: #eef; padding: 12px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [selectedFile, setSelectedFile] = React.useState(null);
            const [result, setResult] = React.useState(null);
            const [lastImage, setLastImage] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);

            // Загрузка сохранённого изображения из localStorage при старте
            React.useEffect(() => {
                                const saved = localStorage.getItem('lastImageData');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        setLastImage(parsed);
                    } catch(e) {}
                }
            }, []);

            const handleFileChange = (e) => {
                setSelectedFile(e.target.files[0]);
                setError(null);
            };

            const handleUpload = async () => {
                if (!selectedFile) {
                    setError("Choose a PNG file");
                    return;
                }
                if (!selectedFile.type.includes('png')) {
                    setError("Only PNG files are allowed");
                    return;
                }

                setLoading(true);
                setError(null);
                const formData = new FormData();
                formData.append('image', selectedFile);

                try {
                    const response = await fetch('/size2json', { method: 'POST', body: formData });
                    const data = await response.json();

                    if (data.result === "invalid filetype") {
                        setError("Invalid file type. Please upload a PNG.");
                        setResult(null);
                    } else if (data.width) {
                        setResult(data);

                        // Сохраняем изображение как Data URL в localStorage
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const imageData = {
                                width: data.width,
                                height: data.height,
                                thumbnail: reader.result,
                                timestamp: Date.now()
                            };
                            setLastImage(imageData);
                            localStorage.setItem('lastImageData', JSON.stringify(imageData));
                        };
                        reader.readAsDataURL(selectedFile);

                    } else {
                        setError("Error processing image");
                    }
                } catch (err) {
                    setError("Network error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div>
                    <div className="card">
                        <h1>Определитель размера PNG (Чагин Фёдор, ЛР-4)</h1>
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center'}}>
                            <input type="file" accept="image/png" onChange={handleFileChange} />
                            <button onClick={handleUpload} disabled={loading}>
                                {loading ? 'Processing...' : 'Get Size'}
                            </button>
                        </div>
                    </div>

                    {error && <div className="card error">{error}</div>}

                    {result && result.width && (
                        <div className="card result">
                            <h3>Result</h3>
                            <p><strong>Width:</strong> {result.width} px</p>
                            <p><strong>Height:</strong> {result.height} px</p>
                            <pre>{JSON.stringify(result, null, 2)}</pre>
                        </div>
                    )}

                    <div className="card">
                        <h3>Last Uploaded Image</h3>
                        {lastImage && lastImage.thumbnail ? (
                            <div>
                                <img src={lastImage.thumbnail} alt="thumbnail" className="thumbnail" />
                                <p><strong>Size:</strong> {lastImage.width} x {lastImage.height} px</p>
                                <p><strong>Uploaded:</strong> {new Date(lastImage.timestamp).toLocaleString()}</p>
                            </div>
                        ) : (
                            <p>No images uploaded yet</p>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
